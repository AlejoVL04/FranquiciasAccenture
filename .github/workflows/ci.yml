# ---------------------------------------------------------------------------
# CI/CD for franchise-api
#
#   every push / PR : unit + integration tests (Testcontainers uses the
#                     runner's Docker daemon), Terraform fmt/validate and a
#                     Docker build check
#   push to main    : the image is published to GitHub Container Registry
#                     as ghcr.io/<owner>/franchise-api:{latest,sha-<commit>}
#   tag vX.Y.Z      : also published as :X.Y.Z
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: franchise-api

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: franchise-api/pom.xml

      - name: Unit and integration tests
        run: mvn -B -ntp verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            franchise-api/target/surefire-reports
            franchise-api/target/failsafe-reports

  terraform:
    name: Terraform (AWS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: franchise-api/infra/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -diff

      # No backend and no credentials: checks syntax, types and references only.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner, which GHCR requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/franchise-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: franchise-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
