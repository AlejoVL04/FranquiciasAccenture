spring:
  application:
    name: franchise-api

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    # DB_PARAMS holds the connection security options. The default suits the
    # Compose MySQL (no TLS); managed cloud databases need e.g. sslMode=REQUIRED.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franchise_db}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true}&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:franchise_user}
    password: ${DB_PASSWORD:franchise_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: franchise-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Below the idle timeout of managed MySQL servers and proxies, so the pool
      # never hands out a connection the server has already dropped.
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    # Flyway owns the schema; Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Off on purpose: on a schema that already holds objects but no history
    # table (e.g. procedures created by hand), a baseline would mark V1 as
    # applied and silently skip creating the franchises table. Failing fast
    # with Flyway's "non-empty schema" error is the safer outcome.
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # PORT is the variable injected by PaaS platforms (Render, Railway, Heroku,
  # Cloud Run); SERVER_PORT takes precedence when set explicitly.
  port: ${SERVER_PORT:${PORT:8080}}
  # Finish in-flight requests before the container stops.
  shutdown: graceful
  # Honour X-Forwarded-* from the platform's load balancer / TLS proxy, so
  # redirects and the Swagger server URL use the public scheme and host.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      # /actuator/health/liveness and /actuator/health/readiness for
      # orchestrators (Kubernetes, ECS, Cloud Run) outside Kubernetes too.
      probes:
        enabled: true
      # Readiness also checks MySQL: an instance that lost the database stops
      # receiving traffic instead of answering 500s.
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.example.franchiseapi: INFO
    org.flywaydb: INFO
